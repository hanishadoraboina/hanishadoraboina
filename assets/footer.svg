<svg width="1000" height="130" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hanisha-os session footer">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07040F"/>
      <stop offset="50%" stop-color="#150A28"/>
      <stop offset="100%" stop-color="#07040F"/>
    </linearGradient>
    <linearGradient id="footText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D9D"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="loadSweepF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D9D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,49% { opacity:1;} 50%,100% { opacity:0;} }
    @keyframes pulseDot { 0%,100% { opacity:0.4; transform:scale(0.85);} 50% { opacity:1; transform:scale(1.15);} }
    .blinkcursor { animation: blink 1s step-end infinite; }
    .pulseDot { animation: pulseDot 1.8s ease-in-out infinite; transform-origin:center; }
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'Cascadia Code','Fira Code',Consolas,monospace; }
  </style>

  <rect width="1000" height="130" fill="url(#footBg)"/>
  <line x1="60" y1="18" x2="940" y2="18" stroke="#3B2065" stroke-width="1"/>

  <text x="60" y="40" font-size="11" class="mono" fill="#6B7396" letter-spacing="1">hanisha-os &#183; session log</text>
  <circle cx="925" cy="35" r="4" fill="#34D399" class="pulseDot"/>
  <text x="936" y="39" font-size="10" class="mono" fill="#34D399">ACTIVE</text>

  <text x="500" y="72" text-anchor="middle" font-size="19" fill="url(#footText)" font-weight="700" class="mono">Thanks for visiting my profile &#9733;</text>
  <text x="500" y="96" text-anchor="middle" font-size="13" fill="#8B93C4" class="mono">SYSTEM STATUS: <tspan fill="#F8FAFC">building dreams, one commit at a time</tspan><tspan class="blinkcursor" fill="#22D3EE">&#9608;</tspan></text>

  <rect x="60" y="112" width="880" height="5" rx="2.5" fill="#FFFFFF" opacity="0.08"/>
  <rect x="60" y="112" width="140" height="5" rx="2.5" fill="url(#loadSweepF)">
    <animate attributeName="x" values="-140;940" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
